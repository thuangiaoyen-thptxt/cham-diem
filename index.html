<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giám Khảo Văn Nghệ AI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-3 min-h-screen">
  <div class="max-w-xl mx-auto space-y-3">
    <!-- Header -->
    <div class="bg-indigo-700 text-white p-3 rounded-xl flex justify-between items-center shadow">
      <div>
        <h1 class="text-base font-bold">Giám Khảo Văn Nghệ AI</h1>
        <p class="text-xs text-indigo-200">Hệ thống gửi bài & Chấm ngầm tự động</p>
      </div>
      <span id="status" class="text-xs bg-slate-500 px-3 py-1 rounded-full font-bold text-center">Chưa bật cam</span>
    </div>

    <!-- Main Box -->
    <div class="bg-white p-3 rounded-xl shadow border space-y-3">
      <div class="relative aspect-video bg-black rounded-lg overflow-hidden flex items-center justify-center">
        <video id="video" autoplay playsinline muted class="w-full h-full object-cover"></video>
        <div id="recordingTag" class="hidden absolute top-3 left-3 bg-red-600 text-white text-xs px-3 py-1 rounded-full font-bold animate-pulse shadow-lg">
          ● ĐANG QUAY VÀ THU ÂM...
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-2">
        <input type="text" id="lop" placeholder="Lớp (VD: 10A1)" class="border p-2 rounded text-sm outline-none focus:border-indigo-500 bg-slate-50 font-semibold">
        <input type="text" id="tietMuc" placeholder="Tên tiết mục" class="border p-2 rounded text-sm outline-none focus:border-indigo-500 bg-slate-50 font-semibold">
        <select id="theLoai" class="border p-2 rounded text-sm outline-none bg-slate-50 font-semibold">
          <option value="Hát">Hát</option>
          <option value="Hát múa">Hát múa</option>
          <option value="Múa">Múa</option>
          <option value="Nhảy hiện đại">Nhảy hiện đại</option>
          <option value="Kịch">Kịch / Hoạt cảnh</option>
          <option value="Độc tấu nhạc cụ">Độc tấu nhạc cụ</option>
        </select>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-4 gap-2 pt-1">
        <button id="btnCam" class="bg-slate-800 text-white font-semibold py-2.5 rounded-lg text-xs shadow hover:bg-slate-700">1. Mở Mic & Cam</button>
        <button id="btnFlip" class="bg-amber-600 text-white font-semibold py-2.5 rounded-lg text-xs shadow hover:bg-amber-700">🔄 Đổi Camera</button>
        <button id="btnRec" disabled class="bg-red-600 disabled:bg-slate-300 text-white font-semibold py-2.5 rounded-lg text-xs shadow transition-colors">2. Bắt đầu quay</button>
        <button id="btnJudge" disabled class="bg-indigo-600 disabled:bg-slate-300 text-white font-semibold py-2.5 rounded-lg text-xs shadow transition-colors">3. Dừng & Gửi</button>
      </div>
    </div>

    <!-- Result Notification -->
    <div id="resBox" class="hidden bg-white p-4 rounded-xl shadow border space-y-3 animate-fade-in">
      <div class="p-3 bg-emerald-50 rounded border border-emerald-200">
        <p id="feedback" class="text-sm text-emerald-800 font-bold text-center"></p>
      </div>
      <button id="btnNext" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 px-4 rounded shadow">
        ➔ Đã xong, Chuẩn bị tiết mục tiếp theo
      </button>
    </div>
  </div>

  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
  </style>

  <script>
    // URL CỦA GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby2A6PAPMkIzJ13jFAEu0WSXbBBun60W5d5fv6Ng-96LkQEpUv88r8gvtk6B5Dy_nBN/exec";

    let stream = null;
    let mediaRecorder = null;
    let audioChunks = [];
    let currentFacingMode = "environment";

    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const recordingTag = document.getElementById('recordingTag');
    const btnCam = document.getElementById('btnCam');
    const btnFlip = document.getElementById('btnFlip');
    const btnRec = document.getElementById('btnRec');
    const btnJudge = document.getElementById('btnJudge');
    const btnNext = document.getElementById('btnNext');

    async function startCameraAndMic() {
      if (stream) stream.getTracks().forEach(track => track.stop());
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: currentFacingMode, width: 640, height: 480 },
          audio: true
        });
        video.srcObject = stream;
        btnRec.disabled = false;
        btnCam.disabled = true;
        status.textContent = "Sẵn sàng quay";
        status.className = "text-xs bg-emerald-500 text-white px-3 py-1 rounded-full font-bold";
      } catch (e) {
        alert("Lỗi cấp quyền Mic/Camera: " + e.message);
      }
    }

    btnCam.onclick = () => startCameraAndMic();
    btnFlip.onclick = () => {
      currentFacingMode = (currentFacingMode === "environment") ? "user" : "environment";
      startCameraAndMic();
    };

    btnRec.onclick = () => {
      const lop = document.getElementById('lop').value.trim();
      const tietMuc = document.getElementById('tietMuc').value.trim();
      if (!lop || !tietMuc) return alert("Thầy vui lòng điền Lớp và Tên tiết mục trước nhé!");

      audioChunks = [];
      recordingTag.classList.remove('hidden');
      btnRec.disabled = true;
      btnJudge.disabled = false;
      status.textContent = "Đang ghi âm...";
      status.className = "text-xs bg-red-600 text-white px-3 py-1 rounded-full font-bold animate-pulse";

      try {
        const audioStream = new MediaStream(stream.getAudioTracks());
        let options = {};
        if (MediaRecorder.isTypeSupported('audio/webm;codecs=opus')) {
          options = { mimeType: 'audio/webm;codecs=opus' };
        } else if (MediaRecorder.isTypeSupported('audio/mp4')) {
          options = { mimeType: 'audio/mp4' };
        }

        mediaRecorder = new MediaRecorder(audioStream, options);
        mediaRecorder.ondataavailable = (e) => {
          if (e.data && e.data.size > 0) audioChunks.push(e.data);
        };
        mediaRecorder.start(500); 
      } catch (err) {
        console.error("Lỗi ghi âm:", err);
      }
    };

    btnJudge.onclick = async () => {
      btnJudge.disabled = true;
      recordingTag.classList.add('hidden');
      status.textContent = "Đang gửi lên mạng...";
      status.className = "text-xs bg-amber-500 text-white px-3 py-1 rounded-full font-bold";

      if (mediaRecorder && mediaRecorder.state !== "inactive") {
        await new Promise(resolve => {
          mediaRecorder.onstop = resolve;
          mediaRecorder.stop();
        });
      }

      let audioBase64 = "";
      if (audioChunks.length > 0) {
        const audioBlob = new Blob(audioChunks, { type: mediaRecorder.mimeType || "audio/webm" });
        audioBase64 = await new Promise(resolve => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.readAsDataURL(audioBlob);
        });
      }

      try {
        const payload = {
          lop: document.getElementById('lop').value,
          tietMuc: document.getElementById('tietMuc').value,
          theLoai: document.getElementById('theLoai').value,
          audioData: audioBase64
        };

        const res = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();
        
        document.getElementById('resBox').classList.remove('hidden');
        document.getElementById('feedback').textContent = data.message || "Đã gửi lên Sheet an toàn!";

        status.textContent = "Gửi thành công";
        status.className = "text-xs bg-blue-600 text-white px-3 py-1 rounded-full font-bold";
      } catch (err) {
        alert("Lỗi khi gửi bài: " + err.message);
        status.textContent = "Lỗi mạng";
        status.className = "text-xs bg-red-600 text-white px-3 py-1 rounded-full font-bold";
      }
    };

    btnNext.onclick = () => {
      document.getElementById('tietMuc').value = "";
      document.getElementById('resBox').classList.add('hidden');
      btnRec.disabled = false;
      btnJudge.disabled = true;
      status.textContent = "Sẵn sàng quay";
      status.className = "text-xs bg-emerald-500 text-white px-3 py-1 rounded-full font-bold";
      document.getElementById('tietMuc').focus();
    };
  </script>
</body>
</html>
